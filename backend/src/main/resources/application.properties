server.address=127.0.0.1
tracker.database-path=${TRACKER_DB_PATH:data/tracker.sqlite}
tracker.time-zone=${TRACKER_TIME_ZONE:}
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=12MB
tracker.backup-root=${TRACKER_BACKUP_ROOT:${user.home}/.dsa-tracker/backups}
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

tracker.mcp-writes-enabled=${TRACKER_MCP_WRITES_ENABLED:false}
spring.ai.mcp.server.enabled=${TRACKER_MCP_ENABLED:false}
spring.ai.mcp.server.name=dsa-tracker
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.tool-callback-converter=false
spring.ai.mcp.server.capabilities.resource=true
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.completion=false

tracker.study-plan-approval-token=${TRACKER_STUDY_PLAN_APPROVAL_TOKEN:}

tracker.mcp-tool-profile=${TRACKER_MCP_TOOL_PROFILE:LEGACY}
