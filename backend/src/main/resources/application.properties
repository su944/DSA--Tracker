server.address=127.0.0.1
tracker.database-path=${TRACKER_DB_PATH:data/tracker.sqlite}
tracker.time-zone=${TRACKER_TIME_ZONE:}
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=12MB
tracker.backup-root=${TRACKER_BACKUP_ROOT:${user.home}/.dsa-tracker/backups}
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
